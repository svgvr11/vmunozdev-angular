<header class="hero">
  <div class="hero__inner">
    <div class="hero__intro">
      <p class="hero__greeting">Hi,</p>
      <h1 class="hero__name">I'm Victor Munoz F.</h1>
      <p class="hero__role">Front-end developer</p>

      <ul class="hero__stack" aria-label="Main technologies">
        @for (tech of stack; track tech) {
          <li>{{ tech }}</li>
        }
      </ul>

      <p class="hero__location">
        <app-icon name="location" />
        Temuco, Chile
      </p>

      <div class="hero__actions">
        @for (cv of cvFiles; track cv.lang) {
          <a class="btn btn--primary" [href]="cv.href" [download]="cv.filename" [attr.hreflang]="cv.lang" type="application/pdf">
            <app-icon name="download" />
            {{ cv.label }}
          </a>
        }
        <a class="btn btn--ghost" href="#projects">
          Projects
          <app-icon name="arrowDown" />
        </a>
        <a class="btn btn--ghost" href="#experience">
          Experience
          <app-icon name="arrowDown" />
        </a>
      </div>
    </div>

    <nav class="hero__social" aria-label="Contact and social profiles">
      <ul>
        @for (link of links; track link.href) {
          <li>
            <a
              [href]="link.href"
              [attr.aria-label]="link.label"
              [attr.title]="link.label"
              [attr.target]="link.external ? '_blank' : null"
              [attr.rel]="link.external ? 'noopener noreferrer' : null"
            >
              <app-icon [name]="link.icon" />
            </a>
          </li>
        }
      </ul>
    </nav>
  </div>
</header>
